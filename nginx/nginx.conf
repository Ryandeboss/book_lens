# A server block defines this HTTP site's behavior.
server {
    # listen selects the container's HTTP port; Compose publishes it on the host.
    listen 80;
    server_name _;
    client_max_body_size 13m;
    client_body_buffer_size 13m;
    client_body_timeout 30s;
    root /usr/share/nginx/html;
    index index.html;

    # location selects requests by URL prefix.
    location /api/ {
        # No trailing slash: preserve /api/ in the upstream request.
        # "backend" is the Compose service name, resolved by Docker networking.
        proxy_pass http://backend:3000;
        proxy_request_buffering off;
        proxy_read_timeout 75s;
        # Forward original host, client chain, and protocol to the API.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # try_files serves real files, then lets Vue Router handle deep links.
        try_files $uri $uri/ /index.html;
    }
}
