services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - '${WEB_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: http://localhost
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
